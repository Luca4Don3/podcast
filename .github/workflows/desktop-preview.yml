name: desktop-preview

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - '.github/workflows/desktop-preview.yml'
      - 'linux/**'
      - 'macos/**'
      - 'tests/build-linux-desktop.sh'
      - 'apple/NativeCache/**'

permissions:
  contents: read

concurrency:
  group: desktop-preview-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux Debian 12 (${{ matrix.abi }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        include:
          - {abi: amd64, runner: ubuntu-24.04, qemu: '', elf_class: 2, elf_machine: 62}
          - {abi: i386, runner: ubuntu-24.04, qemu: '', elf_class: 1, elf_machine: 3}
          - {abi: arm64, runner: ubuntu-24.04-arm, qemu: '', elf_class: 2, elf_machine: 183}
          - {abi: armhf, runner: ubuntu-24.04, qemu: arm, elf_class: 1, elf_machine: 40}
          - {abi: mipsel, runner: ubuntu-24.04, qemu: mipsel, elf_class: 1, elf_machine: 8}
          - {abi: mips64el, runner: ubuntu-24.04, qemu: mips64el, elf_class: 2, elf_machine: 8}
    env:
      ABI: ${{ matrix.abi }}
      QEMU: ${{ matrix.qemu }}
      ELF_CLASS: ${{ matrix.elf_class }}
      ELF_MACHINE: ${{ matrix.elf_machine }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and test Debian architecture in isolated rootfs
        run: bash tests/build-linux-desktop.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-debian12-${{ matrix.abi }}
          path: output/desktop/podcast-linux-debian12-${{ matrix.abi }}.tar.gz
          if-no-files-found: error

  macos:
    name: macOS Universal 2 (${{ matrix.arch }} runtime)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: arm64, runner: macos-15}
          - {arch: x86_64, runner: macos-15-intel}
    env:
      TEST_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure and build Universal 2
        run: |
          test "$(uname -m)" = "$TEST_ARCH"
          cmake -S macos -B output/macos -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES='arm64;x86_64' -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0
          cmake --build output/macos --parallel 3
      - name: Verify slices and run tests natively
        run: |
          app=output/macos/podcast.app
          lipo "$app/Contents/MacOS/podcast" -verify_arch arm64 x86_64
          lipo -info "$app/Contents/MacOS/podcast"
          codesign --verify --strict "$app"
          ctest --test-dir output/macos --output-on-failure --no-tests=error
      - name: Archive Universal 2 preview
        if: matrix.arch == 'arm64'
        run: ditto -c -k --keepParent output/macos/podcast.app output/podcast-macos-universal2.zip
      - uses: actions/upload-artifact@v4
        if: matrix.arch == 'arm64'
        with:
          name: macos-universal2
          path: output/podcast-macos-universal2.zip
          if-no-files-found: error
