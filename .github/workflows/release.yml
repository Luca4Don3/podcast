name: release

on:
  workflow_dispatch:
    inputs:
      apple_launch_smoke:
        description: Install and launch on representative small and large iPhone and iPad simulators
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Android phone and tablet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" "cmake;3.22.1" >/dev/null
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Test and export APKs
        working-directory: android
        run: ./gradlew --no-daemon :app:testCompactUnitTest :app:exportCompactApks
      - name: Check large-screen support
        run: |
          python3 - <<'PY'
          import pathlib
          manifest = pathlib.Path("android/app/src/main/AndroidManifest.xml").read_text()
          for key in ('android:resizeableActivity="true"', "screenLayout", "smallestScreenSize"):
              assert key in manifest, key
          found = sorted(pathlib.Path("android/app/build/outputs/podcast").rglob("podcast-*.apk"))
          assert found, "no APK exported"
          print("\n".join(f"{p} {p.stat().st_size}" for p in found))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: android/app/build/outputs/podcast/compact/**/podcast-*.apk
          if-no-files-found: error

  apple:
    name: iPhone and iPad simulator
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test shared API
        run: swift test --package-path apple
      - name: Build and check the universal simulator app
        run: bash apple/build-simulator.sh output/apple
      - uses: actions/upload-artifact@v4
        with:
          name: apple-simulator
          path: output/apple/podcast-*-ios-simulator.zip
          if-no-files-found: error
      - name: Check small and large iPhone and iPad simulators
        if: inputs.apple_launch_smoke == true
        timeout-minutes: 27
        run: bash apple/smoke-simulator.sh output/apple/DerivedData/Build/Products/Release-iphonesimulator/podcast.app

  publish:
    name: Publish release
    if: github.ref_type == 'tag'
    needs: [android, apple]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "{android,apple-simulator}"
      - name: Collect assets
        run: |
          python3 - <<'PY'
          import os, pathlib, shutil
          version = next(line.split('"')[1] for line in
              pathlib.Path("android/app/build.gradle.kts").read_text().splitlines()
              if line.startswith("val podcastVersion ="))
          assert os.environ["GITHUB_REF_NAME"] == "v" + version, "tag/version mismatch"
          out = pathlib.Path("assets"); out.mkdir()
          seen = set()
          for apk in sorted(pathlib.Path("artifacts/android").rglob("podcast-*.apk")):
              abi = apk.parent.name
              universal = abi in ("android", "compact", version)
              name = f"podcast-{version}.apk" if universal else f"podcast-{version}-{abi}.apk"
              if name in seen:
                  continue
              seen.add(name)
              shutil.copy2(apk, out / name)
          apple = pathlib.Path("artifacts/apple-simulator") / f"podcast-{version}-ios-simulator.zip"
          shutil.copy2(apple, out / apple.name)
          assert (out / f"podcast-{version}.apk").is_file(), "universal Android APK missing"
          pathlib.Path("version.txt").write_text(version + "\n")
          print("\n".join(sorted(p.name for p in out.iterdir())))
          PY
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cat version.txt)
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::warning::Release $tag already exists; refusing to overwrite published assets. Bump podcastVersion to publish a new release."
            exit 0
          fi
          (cd assets && sha256sum -- * > SHA256SUMS)
          flags=()
          if [[ "$version" == *-rc* ]]; then flags+=(--prerelease); fi
          gh release create "$tag" assets/* --verify-tag "${flags[@]}" \
            --title "podcast $version" \
            --notes "Client-only build: Android phone/tablet APK (CI test signing) and iPhone/iPad simulator app (not a device IPA). The app receives public podcast feeds and platform share links; no self-hosted server is required. Desktop clients are not included."
