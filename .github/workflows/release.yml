name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Android phone and tablet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" "cmake;3.22.1" >/dev/null
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Test and export APKs
        working-directory: android
        run: ./gradlew --no-daemon :app:testCompactUnitTest :app:exportCompactApks
      - name: Check large-screen support
        run: |
          python3 - <<'PY'
          import pathlib
          manifest = pathlib.Path("android/app/src/main/AndroidManifest.xml").read_text()
          for key in ('android:resizeableActivity="true"', "screenLayout", "smallestScreenSize"):
              assert key in manifest, key
          found = sorted(pathlib.Path("android/app/build/outputs/podcast").rglob("podcast-*.apk"))
          assert found, "no APK exported"
          print("\n".join(f"{p} {p.stat().st_size}" for p in found))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: android/app/build/outputs/podcast/compact/**/podcast-*.apk
          if-no-files-found: error

  server-linux:
    name: Server Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake libssl-dev libsqlite3-dev
      - run: |
          cmake -S server-cpp -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"
          ctest --test-dir build --output-on-failure
      - run: |
          mkdir -p out
          cp build/podcast-server out/podcast-server-linux-x86_64
          sha256sum out/* > out/SHA256SUMS-linux
      - uses: actions/upload-artifact@v4
        with:
          name: server-linux
          path: out/
          if-no-files-found: error

  server-macos:
    name: Server macOS (optional)
    if: ${{ github.event_name == 'push' }}
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: brew install openssl@3 sqlite cmake
      - run: |
          cmake -S server-cpp -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix openssl@3);$(brew --prefix sqlite)" \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"
          cmake --build build -j"$(sysctl -n hw.ncpu)"
          ctest --test-dir build --output-on-failure
      - run: |
          mkdir -p out
          cp build/podcast-server out/podcast-server-macos-x86_64
          shasum -a 256 out/* > out/SHA256SUMS-macos
      - uses: actions/upload-artifact@v4
        with:
          name: server-macos
          path: out/
          if-no-files-found: error

  server-windows:
    name: Server Windows (optional)
    runs-on: windows-latest
    continue-on-error: true
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-sqlite3
      - run: |
          cmake -S server-cpp -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          ctest --test-dir build --output-on-failure
      - run: |
          mkdir -p out
          cp build/podcast-server.exe out/podcast-server-windows-x86_64.exe
          sha256sum out/* > out/SHA256SUMS-windows
      - uses: actions/upload-artifact@v4
        with:
          name: server-windows
          path: out/
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [android, server-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect assets
        run: |
          python3 - <<'PY'
          import pathlib, shutil
          version = next(line.split('"')[1] for line in
              pathlib.Path("android/app/build.gradle.kts").read_text().splitlines()
              if line.startswith("val podcastVersion ="))
          out = pathlib.Path("assets"); out.mkdir()
          seen = set()
          for apk in sorted(pathlib.Path("artifacts/android").rglob("podcast-*.apk")):
              abi = apk.parent.name
              name = f"podcast-{version}-{abi}.apk" if abi not in ("android", "compact") else f"podcast-{version}.apk"
              if name in seen:
                  continue
              seen.add(name)
              shutil.copy2(apk, out / name)
          for binary in pathlib.Path("artifacts").glob("server-*/*"):
              if binary.is_file() and not binary.name.startswith("SHA256SUMS"):
                  shutil.copy2(binary, out / binary.name)
          pathlib.Path("version.txt").write_text(version + "\n")
          print("\n".join(sorted(p.name for p in out.iterdir())))
          PY
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cat version.txt)
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::warning::Release $tag already exists; refusing to overwrite published assets. Bump podcastVersion to publish a new release."
            exit 0
          fi
          gh release create "$tag" \
            --title "podcast $version" \
            --notes "Android phone/tablet APK (CI debug signing) and Linux x86_64 server binary. Desktop and iOS clients are not implemented yet."
          gh release upload "$tag" assets/*
