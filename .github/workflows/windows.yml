name: windows

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - '.github/workflows/windows.yml'
      - 'windows/**'
      - 'apple/NativeCache/**'

permissions:
  contents: read

concurrency:
  group: windows-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Native Win32 ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            pe_machine: '8664'
            artifact: windows-x64
          - arch: ARM64
            runner: windows-11-arm
            pe_machine: 'AA64'
            artifact: windows-arm64
    defaults:
      run:
        shell: pwsh
    env:
      TARGET_ARCH: ${{ matrix.arch }}
      PE_MACHINE: ${{ matrix.pe_machine }}
    steps:
      - name: Verify native runner architecture
        run: |
          $osArch = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
          $processArch = [System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString()
          Write-Output "Runner=$env:RUNNER_ARCH OS=$osArch PowerShell=$processArch target=$env:TARGET_ARCH"
          if ($env:RUNNER_ARCH -ne $env:TARGET_ARCH -or $osArch -ne $env:TARGET_ARCH -or $processArch -ne $env:TARGET_ARCH) {
            throw "Expected a native $env:TARGET_ARCH runner and PowerShell process."
          }
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure
        run: cmake -S windows -B windows/build -A $env:TARGET_ARCH -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build windows/build --config Release --parallel 2
      - name: Verify executable PE Machine types
        run: |
          $release = 'windows/build/Release'
          $expected = [Convert]::ToUInt16($env:PE_MACHINE, 16)
          if (-not (Test-Path -LiteralPath "$release/podcast.exe" -PathType Leaf)) {
            throw 'Missing podcast.exe'
          }
          foreach ($exe in (Get-ChildItem -LiteralPath $release -Filter '*.exe' -File)) {
            $reader = [System.IO.BinaryReader]::new($exe.OpenRead())
            try {
              if ($reader.BaseStream.Length -lt 64 -or $reader.ReadUInt16() -ne 0x5A4D) {
                throw "Invalid DOS header: $($exe.Name)"
              }
              $reader.BaseStream.Position = 0x3C
              $peOffset = $reader.ReadUInt32()
              if ($peOffset -lt 64 -or $peOffset -gt ($reader.BaseStream.Length - 6)) {
                throw "Invalid PE header offset: $($exe.Name)"
              }
              $reader.BaseStream.Position = $peOffset
              if ($reader.ReadUInt32() -ne 0x00004550) {
                throw "Invalid PE signature: $($exe.Name)"
              }
              $machine = $reader.ReadUInt16()
              $report = '{0}: PE Machine 0x{1:X4}, expected 0x{2:X4}' -f $exe.Name, $machine, $expected
              if ($machine -ne $expected) { throw $report }
              Write-Output $report
            } finally {
              $reader.Dispose()
            }
          }
      - name: Run Windows tests (including startup)
        run: ctest --test-dir windows/build -C Release --output-on-failure --no-tests=error
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: windows/build/Release/podcast.exe
          if-no-files-found: error
