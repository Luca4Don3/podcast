[global]
    server role = standalone server
    workgroup = WORKGROUP
    server min protocol = SMB2_02
    server max protocol = SMB3_11
    server signing = mandatory
    server multi channel support = no
    smb ports = 445
    disable netbios = yes
    map to guest = Never
    load printers = no
    disable spoolss = yes

[podcasts]
    path = /fixture
    read only = yes
    guest ok = no
    valid users = podcast_fixture
    follow symlinks = no
    wide links = no
